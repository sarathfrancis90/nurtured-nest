services:
  db:
    image: postgres:18.4-alpine
    container_name: nurtured-nest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nurtured_nest
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - nurtured_nest_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nurtured_nest"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  nurtured_nest_pg:
