name: Production notification lifecycle smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-lifecycle:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://www.nurturednest.ca
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run production notification lifecycle
        run: node scripts/production-notification-smoke.mjs
